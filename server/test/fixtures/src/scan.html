<body>
  <h1>ملاحظات المحاضرة: الإنزيمات</h1>
  <p>الإنزيمات (Enzymes) بروتينات تعمل كعوامل حفّازة (Catalysts) تسرّع التفاعلات الكيميائية دون أن تُستهلك.</p>
  <p>يرتبط الإنزيم بالمادة المتفاعلة (Substrate) في الموقع النشط (Active site).</p>
  <p>تتأثر سرعة عمل الإنزيم بدرجة الحرارة والرقم الهيدروجيني (pH).</p>
